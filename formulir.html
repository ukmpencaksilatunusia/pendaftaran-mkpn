<!-- formulir.html -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulir UKT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            hijaukeren: "#006635",
            hitamkeren: "#231f20",
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen" style="background-image: url('bg1.png'); background-size: cover; background-position: center;">

  <!-- Header -->
  <header class="bg-hitamkeren text-white p-4 flex items-center">
    <img src="logo pn.png" alt="Logo" class="h-10 mr-4">
    <h1 class="text-xl font-semibold">PAGARNUSA UNUSIA</h1>
  </header>

  <main class="flex justify-center p-6">
    <form action="pembayaran.html" method="GET" enctype="multipart/form-data"
          class="bg-[rgba(0,0,0,0.5)] p-8 rounded-2xl shadow-md w-full max-w-2xl space-y-6">
      <div>
        <label class="block text-white font-bold" style="font-size: 22px;">Formulir Pendaftaran</label>
      <div>
        <label class="block text-white font-semibold">Madrasah Kaderisasi PAGARNUSA</label>
      <div>
      <label class="block text-white font-semibold">‎</label>
      <!-- Email -->
      <div>
        <label class="block text-white font-semibold">Email</label>
        <input type="email" name="email" required
               class="mt-1 w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-hijaukeren">
      </div>
      
      <!-- Nama Lengkap -->
      <div>
        <label class="block text-white font-semibold">Nama Lengkap</label>
        <input type="text" name="nama" required
               class="mt-1 w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-hijaukeren">
      </div>
      
      <!-- No Handphone -->
      <div>
        <label class="block text-white font-semibold">No Handphone</label>
        <input type="tel" name="phone" required
               class="mt-1 w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-hijaukeren">
      </div>
      
      <!-- Angkatan -->
      <div>
        <label class="block text-white font-semibold">Angkatan</label>
        <select name="angkatan" required
                class="mt-1 w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-hijaukeren">
          <option disabled selected>Pilih Angkatan</option>
          <option>2021</option>
          <option>2022</option>
          <option>2023</option>
          <option>2024</option>
        </select>
      </div>
      
      <!-- Tanggal Lahir -->
      <div>
        <label class="block text-white font-semibold">Tanggal Lahir</label>
        <input type="date" name="tanggal_lahir" required
               class="mt-1 w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-hijaukeren">
      </div>
      
      <!-- Alamat -->
      <div>
        <label class="block text-white font-semibold">Alamat</label>
        <input type="text" name="alamat" required
               class="mt-1 w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-hijaukeren">
      </div>
      
      <!-- Tingkatan Saat Ini -->
      <div>
        <label class="block text-white font-semibold">Tingkatan Saat Ini</label>
        <select name="tingkatan_saat_ini" required
                class="mt-1 w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-hijaukeren">
          <option disabled selected>Pilih Tingkatan</option>
          <option>Putih</option>
          <option>Kuning</option>
          <option>Merah</option>
        </select>
      </div>
      
      <!-- Ujian Tingkatan -->
      <div>
        <label class="block text-white font-semibold">Ujian Tingkatan</label>
        <select name="ujian_tingkatan" required
                class="mt-1 w-full p-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-hijaukeren">
          <option disabled selected>Pilih Tujuan Ujian</option>
          <option>Kuning</option>
          <option>Merah</option>
          <option>Biru / Asisten Pelatih</option>
        </select>
      </div>
      
      <!-- Riwayat Penyakit -->
      <div class="mb-4">
        <label class="block text-white font-semibold mb-2">Apakah Kang/Mbk memiliki Riwayat Penyakit?</label>
        <div class="flex items-center gap-4">
          <label class="flex items-center">
            <input type="radio" name="riwayat" value="ya" onclick="toggleRiwayat(true)" class="mr-2">
            <span class="text-white">Ya</span>
          </label>
          <label class="flex items-center">
            <input type="radio" name="riwayat" value="tidak" onclick="toggleRiwayat(false)" class="mr-2">
            <span class="text-white">Alhamdulillah Tidak</span>
          </label>
          
    </label>
  </div>

  <!-- Input Tambahan (Muncul jika pilih "Ya") -->
  <div id="riwayatInput" class="hidden mt-3 transition-all duration-300">
    <label class="block text-white font-medium text-gray-700 mb-1">Silakan jelaskan (maks. 50 kata)</label>
    <textarea name="keterangan_riwayat" rows="3" maxlength="500"
              oninput="limitWords(this, 50)"
              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-hijaukeren"></textarea>
    <p id="wordCount" class="text-white text-gray-500 mt-1">0 / 50 kata</p>
  </div>
</div>

<!-- JavaScript -->
<script>
  function toggleRiwayat(show) {
    const inputDiv = document.getElementById('riwayatInput');
    inputDiv.classList.toggle('hidden', !show);
  }

  function limitWords(textarea, maxWords) {
    const words = textarea.value.trim().split(/\s+/);
    const wordCount = words.filter(word => word.length > 0).length;
    const counter = document.getElementById('wordCount');
    counter.textContent = `${wordCount} / ${maxWords} kata`;

    if (wordCount > maxWords) {
      // Pangkas teks ke jumlah kata maksimal
      textarea.value = words.slice(0, maxWords).join(" ");
      counter.textContent = `${maxWords} / ${maxWords} kata`;
    }
  }
</script>

      <!-- Upload Sertifikat -->
<div>
  <label class="block text-white font-semibold">Upload Sertifikat UKT Terakhir</label>
  <input type="file" name="sertifikat" accept=".png,.jpg,.jpeg,.pdf"
         id="fileInput"
         class="mt-1 w-full p-3 rounded-lg border border-gray-300 file:bg-hijaukeren file:text-white file:rounded-lg file:px-4 file:py-2 file:border-0">
  <p id="fileLabel" class="text-white mt-2">Tidak ada file yang dipilih</p>
</div>

<!-- JavaScript untuk mengubah teks -->
<script>
  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');

  fileInput.addEventListener('change', function() {
    if (fileInput.files.length > 0) {
      fileLabel.textContent = fileInput.files[0].name;
    } else {
      fileLabel.textContent = 'Tidak ada file yang dipilih';
    }
  });
</script>


      <!-- Tombol Konfirmasi -->
      <div class="text-center">
        <button type="submit"
                class="bg-hijaukeren text-white px-6 py-3 rounded-lg hover:bg-green-800 transition duration-300 shadow-md">
          Konfirmasi & Lanjut ke Pembayaran
        </button>
      </div>
    </form>
  </main>
</body>
</html>
